name: Deploy AI assistant to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ai-assistant-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Python Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AETHER_CART_TOKEN_SECRET: ${{ secrets.AETHER_CART_TOKEN_SECRET }}
      AETHER_API_BASE_URL: ${{ vars.AETHER_API_ORIGIN || vars.NEXT_PUBLIC_AETHER_API_URL }}
      AI_CORS_ALLOWED_ORIGINS: ${{ vars.APP_ORIGIN_STORE }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$GEMINI_API_KEY"
          test -n "$AETHER_CART_TOKEN_SECRET"

      - name: Deploy AI assistant Worker
        working-directory: aether-commerce/apps/ai-assistant
        run: python -m uv tool run --from workers-py pywrangler deploy --keep-vars

      - name: Smoke public health
        run: |
          curl --fail --retry 5 --retry-delay 3 https://aether-ai.pickofwow.workers.dev/healthz
