name: Deploy AI assistant to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ai-assistant-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AETHER_CART_TOKEN_SECRET: ${{ secrets.AETHER_CART_TOKEN_SECRET }}
      AETHER_API_BASE_URL: ${{ vars.AETHER_API_ORIGIN || vars.NEXT_PUBLIC_AETHER_API_URL }}
      AI_CORS_ALLOWED_ORIGINS: ${{ vars.APP_ORIGIN_STORE }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$GEMINI_API_KEY"
          test -n "$AETHER_CART_TOKEN_SECRET"

      - name: Deploy AI assistant Worker
        working-directory: aether-commerce/apps/ai-assistant
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars

      - name: Configure AI assistant secrets
        working-directory: aether-commerce/apps/ai-assistant
        run: |
          node -e "const fs=require('fs'); const keys=['GEMINI_API_KEY','DATABASE_URL','AETHER_CART_TOKEN_SECRET','GEMINI_FALLBACK_MODEL']; const out={}; for (const key of keys) if (process.env[key]) out[key]=process.env[key]; fs.writeFileSync('.ai-secrets.json', JSON.stringify(out));"
          npx wrangler secret bulk .ai-secrets.json --config wrangler.jsonc
          rm .ai-secrets.json

      - name: Smoke public health
        run: |
          curl --fail --retry 5 --retry-delay 3 https://aether-ai.pickofwow.workers.dev/healthz
