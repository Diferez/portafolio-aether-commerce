name: Portfolio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and test
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio.example.com
          NEXT_PUBLIC_STORE_URL: https://store.example.com
          NEXT_PUBLIC_AETHER_API_URL: https://api.example.com
          AETHER_API_ORIGIN: https://api.example.com
        run: npm test
      - name: Verify deployment output
        run: test -f dist/server/index.js
