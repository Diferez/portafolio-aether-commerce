name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: aether-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.AETHER_D1_DATABASE_ID != '' && vars.NEXT_PUBLIC_AETHER_API_URL != '' && vars.NEXT_PUBLIC_PORTFOLIO_URL != '' && vars.APP_ORIGIN_ADMIN != '' }}

    env:
      AETHER_API_WORKER_NAME: ${{ vars.AETHER_API_WORKER_NAME || 'aether-api' }}
      AETHER_FRONT_WORKER_NAME: ${{ vars.AETHER_FRONT_WORKER_NAME || 'portafolio-aether-commerce' }}
      AETHER_ADMIN_PAGES_PROJECT: ${{ vars.AETHER_ADMIN_PAGES_PROJECT || 'aether-admin' }}
      AETHER_D1_DATABASE_NAME: ${{ vars.AETHER_D1_DATABASE_NAME || 'aether-production' }}
      AETHER_D1_DATABASE_ID: ${{ vars.AETHER_D1_DATABASE_ID }}
      AETHER_ENV: production
      PLATZI_API_BASE_URL: ${{ vars.PLATZI_API_BASE_URL || 'https://api.escuelajs.co/api/v1' }}
      NEXT_PUBLIC_AETHER_API_URL: ${{ vars.NEXT_PUBLIC_AETHER_API_URL }}
      AETHER_API_ORIGIN: ${{ vars.AETHER_API_ORIGIN || vars.NEXT_PUBLIC_AETHER_API_URL }}
      NEXT_PUBLIC_PORTFOLIO_URL: ${{ vars.NEXT_PUBLIC_PORTFOLIO_URL }}
      APP_ORIGIN_STORE: ${{ vars.APP_ORIGIN_STORE || vars.NEXT_PUBLIC_PORTFOLIO_URL }}
      APP_ORIGIN_ADMIN: ${{ vars.APP_ORIGIN_ADMIN }}
      NEXT_PUBLIC_AETHER_AI_URL: ${{ vars.NEXT_PUBLIC_AETHER_AI_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portfolio dependencies
        run: npm ci

      - name: Install Aether dependencies
        working-directory: aether-commerce
        run: pnpm install --frozen-lockfile

      - name: Verify required deployment settings
        run: |
          test -n "${AETHER_D1_DATABASE_ID}"
          test -n "${NEXT_PUBLIC_AETHER_API_URL}"
          test -n "${NEXT_PUBLIC_PORTFOLIO_URL}"
          test -n "${APP_ORIGIN_ADMIN}"

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Lint and test
        run: |
          npm run lint
          pnpm --dir aether-commerce typecheck
          pnpm --dir aether-commerce lint
          pnpm --dir aether-commerce test
          pnpm --dir aether-commerce openapi:check

      - name: AI assistant tests
        working-directory: aether-commerce/apps/ai-assistant
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "."
        run: |
          python -m pip install -r requirements-docker.txt
          python -m compileall app tests scripts
          python scripts/security_scan.py
          python -m app.evaluation
          python scripts/acceptance_audit.py
          python tests/run_direct.py

      - name: Build AI assistant image
        working-directory: aether-commerce/apps/ai-assistant
        run: docker build -t aether-ai-assistant:test .

      - name: Smoke AI assistant image
        working-directory: aether-commerce/apps/ai-assistant
        run: |
          docker run --rm -d --name aether-ai-assistant-smoke -p 8090:8090 \
            -e AETHER_API_BASE_URL=https://preview-api.invalid \
            -e AETHER_CART_TOKEN_SECRET=ci-cart-token-secret \
            -e DATABASE_URL= \
            -e REDIS_URL= \
            aether-ai-assistant:test
          trap 'docker stop aether-ai-assistant-smoke || true' EXIT
          python scripts/smoke.py

      - name: Build portfolio and storefront
        run: npm run build

      - name: Build admin
        working-directory: aether-commerce
        run: pnpm --filter @aether/admin build

      - name: Verify build outputs
        run: |
          test -f dist/server/index.js
          test -f dist/client/store/index.html
          test -f aether-commerce/apps/admin/out/index.html

      - name: Generate Aether API Wrangler config
        run: node scripts/write-aether-api-wrangler-config.mjs

      - name: Patch front Worker config
        run: node scripts/patch-front-worker-config.mjs

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: aether-commerce/apps/api
          wranglerVersion: "4"
          command: d1 migrations apply DB --remote --config wrangler.production.json

      - name: Deploy Aether API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: aether-commerce/apps/api
          wranglerVersion: "4"
          command: deploy --config wrangler.production.json

      - name: Deploy portfolio and storefront Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config dist/server/wrangler.json

      - name: Deploy admin Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy aether-commerce/apps/admin/out --project-name=${{ env.AETHER_ADMIN_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy AI assistant Worker
        working-directory: aether-commerce/apps/ai-assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd ../../..
          node scripts/write-aether-ai-wrangler-config.mjs
          cd aether-commerce/apps/ai-assistant
          npx wrangler deploy --config wrangler.production.json --keep-vars

      - name: Configure AI assistant secrets
        working-directory: aether-commerce/apps/ai-assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
          AETHER_CART_TOKEN_SECRET: ${{ secrets.AETHER_CART_TOKEN_SECRET }}
          AI_OPERATIONS_TOKEN: ${{ secrets.AI_OPERATIONS_TOKEN }}
        run: |
          node -e "const fs=require('fs'); const keys=['GEMINI_API_KEY','DATABASE_URL','AETHER_CART_TOKEN_SECRET','AI_OPERATIONS_TOKEN']; const out={}; for (const key of keys) if (process.env[key]) out[key]=process.env[key]; fs.writeFileSync('.ai-secrets.json', JSON.stringify(out));"
          npx wrangler secret bulk .ai-secrets.json --config wrangler.production.json
          rm .ai-secrets.json

      - name: Verify API health
        run: curl --fail --retry 3 --retry-delay 5 "${NEXT_PUBLIC_AETHER_API_URL}/api/v1/health"

      - name: Verify portfolio
        run: curl --fail --retry 3 --retry-delay 5 "${NEXT_PUBLIC_PORTFOLIO_URL}"

      - name: Verify admin
        run: curl --fail --retry 3 --retry-delay 5 "${APP_ORIGIN_ADMIN}"

      - name: Verify AI assistant
        if: ${{ vars.NEXT_PUBLIC_AETHER_AI_URL != '' }}
        run: curl --fail --retry 3 --retry-delay 5 "${NEXT_PUBLIC_AETHER_AI_URL}/healthz"
