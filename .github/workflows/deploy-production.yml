name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PORTFOLIO_WORKER_NAME: ${{ vars.PORTFOLIO_WORKER_NAME || 'portafolio-aether-commerce' }}
      PORTFOLIO_CUSTOM_DOMAINS: ${{ vars.PORTFOLIO_CUSTOM_DOMAINS || 'diferez.com,www.diferez.com' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://diferez.com' }}
      NEXT_PUBLIC_STORE_URL: ${{ vars.NEXT_PUBLIC_STORE_URL || 'https://aether-storefront.pickofwow.workers.dev' }}
      NEXT_PUBLIC_AETHER_API_URL: ${{ vars.NEXT_PUBLIC_AETHER_API_URL }}
      AETHER_API_ORIGIN: ${{ vars.AETHER_API_ORIGIN || vars.NEXT_PUBLIC_AETHER_API_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify public connections
        run: |
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_STORE_URL NEXT_PUBLIC_AETHER_API_URL AETHER_API_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for the production deploy"
              exit 1
            fi
          done
      - name: Validate portfolio
        run: npm run lint && npm test
      - name: Configure Worker
        run: node scripts/patch-front-worker-config.mjs
      - name: Deploy portfolio Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config dist/server/wrangler.json
      - name: Verify portfolio and store link
        run: |
          curl --fail --retry 3 --retry-delay 5 "${NEXT_PUBLIC_SITE_URL}"
          curl --fail --retry 3 --retry-delay 5 "${NEXT_PUBLIC_STORE_URL}"
