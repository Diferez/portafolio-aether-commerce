name: AI assistant image

on:
  push:
    branches:
      - main
    paths:
      - "aether-commerce/apps/ai-assistant/**"
      - ".github/workflows/ai-assistant-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-assistant-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, smoke and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_NAME: ghcr.io/diferez/aether-ai-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image
        working-directory: aether-commerce/apps/ai-assistant
        run: docker build -t aether-ai-assistant:test .

      - name: Smoke image
        working-directory: aether-commerce/apps/ai-assistant
        run: |
          docker run --rm -d --name aether-ai-assistant-smoke -p 8090:8090 \
            -e AETHER_API_BASE_URL=https://preview-api.invalid \
            -e AETHER_CART_TOKEN_SECRET=ci-cart-token-secret \
            -e DATABASE_URL= \
            -e REDIS_URL= \
            aether-ai-assistant:test
          trap 'docker stop aether-ai-assistant-smoke || true' EXIT
          python scripts/smoke.py

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker tag aether-ai-assistant:test "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag aether-ai-assistant:test "${IMAGE_NAME}:latest"

      - name: Push image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"
