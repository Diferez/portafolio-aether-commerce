name: Aether CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aether-commerce/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: aether-commerce
        run: pnpm install --frozen-lockfile=false
      - name: Secret scan
        working-directory: aether-commerce
        run: |
          ! grep -R "sk_live_\|rk_live_\|whsec_[A-Za-z0-9]" -n apps packages docs || exit 1
      - name: Typecheck
        working-directory: aether-commerce
        run: pnpm typecheck
      - name: Lint
        working-directory: aether-commerce
        run: pnpm lint
      - name: Unit and contract tests
        working-directory: aether-commerce
        run: pnpm test
      - name: AI assistant tests
        working-directory: aether-commerce/apps/ai-assistant
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "."
        run: |
          python -m pip install -r requirements.txt
          python -m compileall app tests scripts
          python scripts/security_scan.py
          python -m app.evaluation
          python scripts/acceptance_audit.py
          python tests/run_direct.py
      - name: Build AI assistant image
        working-directory: aether-commerce/apps/ai-assistant
        run: docker build -t aether-ai-assistant:test .
      - name: Smoke AI assistant image
        working-directory: aether-commerce/apps/ai-assistant
        run: |
          docker run --rm -d --name aether-ai-assistant-smoke -p 8090:8090 \
            -e AETHER_API_BASE_URL=https://preview-api.invalid \
            -e AETHER_CART_TOKEN_SECRET=ci-cart-token-secret \
            -e DATABASE_URL= \
            -e REDIS_URL= \
            aether-ai-assistant:test
          trap 'docker stop aether-ai-assistant-smoke || true' EXIT
          python scripts/smoke.py
      - name: OpenAPI check
        working-directory: aether-commerce
        run: pnpm openapi:check
      - name: Build
        working-directory: aether-commerce
        run: pnpm build
      - name: Install Playwright browser
        working-directory: aether-commerce
        run: pnpm exec playwright install chromium
      - name: Assistant widget E2E
        working-directory: aether-commerce
        run: pnpm test:e2e:assistant
