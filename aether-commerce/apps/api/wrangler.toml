name = "aether-api"
main = "src/index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[vars]
AETHER_ENV = "development"
PLATZI_API_BASE_URL = "https://api.escuelajs.co/api/v1"

[[d1_databases]]
binding = "DB"
database_name = "aether-demo"
database_id = "replace-with-cloudflare-d1-id"
migrations_dir = "migrations"
